spring.application.name=central-auth

# Disable Hibernate DDL auto-generation
spring.jpa.hibernate.ddl-auto=validate

# Database configuration
# Local dev only: H2 in-memory, running in PostgreSQL compatibility mode
# so migrations are written in Postgres dialect from day one.
spring.datasource.url=jdbc:h2:mem:centralauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

# Optional Flyway configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
