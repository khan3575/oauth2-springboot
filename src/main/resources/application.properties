spring.application.name=central-auth

# Disable Hibernate DDL auto-generation
spring.jpa.hibernate.ddl-auto=validate

# Database configuration
# Local dev only: H2 in-memory, running in PostgreSQL compatibility mode
# so migrations are written in Postgres dialect from day one.
spring.datasource.url=jdbc:h2:mem:centralauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

# Optional Flyway configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# logging configuration
logging.level.root=INFO
logging.file.name=logs/central-auth.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/archived/central-auth.%d{yyyy-MM-dd}.%i.log
