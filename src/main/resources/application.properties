spring.application.name=oauth2-springboot

# Base URL used to build links in emails (verification, password reset)
# and as the OAuth2 authorization server issuer.
app.base-url=http://localhost:8080

# Origins allowed to call /api/** cross-origin, comma-separated (e.g. local frontend dev server).
app.cors.allowed-origins=http://localhost:3000

# Disable Hibernate DDL auto-generation
spring.jpa.hibernate.ddl-auto=validate

# Database configuration
# Local dev only: H2 in-memory, running in PostgreSQL compatibility mode
# so migrations are written in Postgres dialect from day one.
spring.datasource.url=jdbc:h2:mem:oauth2springboot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

# Optional Flyway configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# logging configuration
logging.level.root=INFO
logging.file.name=logs/oauth2-springboot.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/archived/oauth2-springboot.%d{yyyy-MM-dd}.%i.log
