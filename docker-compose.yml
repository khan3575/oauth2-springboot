services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-oauth2springboot}
      POSTGRES_USER: ${DB_USERNAME:-oauth2user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oauth2user} -d ${DB_NAME:-oauth2springboot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oauth2springboot}
      DB_USERNAME: ${DB_USERNAME:-oauth2user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set, see .env.example}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set, see .env.example}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set, see .env.example}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set, see .env.example}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
